<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diabolik Archive</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<script src="/static/app.js"></script>
<script>
    renderNavbar('home');
</script>

<div class="container">
    <div class="search-bar">
        <input type="text" id="q" placeholder="Cerca per titolo...">
        <button class="filters-toggle" id="filters-toggle-btn" onclick="toggleFilters()">🔽 Filtri</button>
    </div>

    <div class="filters-panel hidden" id="filters-panel">
        <select id="filter-anno">
            <option value="">Tutti gli anni</option>
        </select>
        <div class="filter-autore-wrap">
            <input type="text" id="filter-autore" placeholder="Autore (soggetto, disegni...)" autocomplete="off">
            <div class="tag-suggestions" id="autore-suggestions"></div>
        </div>
        <input type="text" id="filter-sinossi" placeholder="Parola nella sinossi...">
        <select id="filter-tag">
            <option value="">Tutti i tag</option>
        </select>
        <label>
            <input type="checkbox" id="filter-preferito">
            Solo preferiti
        </label>
        <button class="btn" onclick="resetFilters()">↺ Reset filtri</button>
    </div>

    <div class="results-counter" id="counter"></div>

    <div class="grid" id="grid"></div>

    <div class="pagination" id="pagination"></div>
</div>

<script>
    const LIMIT = 50;
    let currentPage = 1;
    let totalResults = 0;

    let allTags = [];

    function toggleFilters() {
        const panel = document.getElementById('filters-panel');
        const isHidden = panel.classList.contains('hidden');
        if (!isHidden && countActiveFilters() > 0) return;
        panel.classList.toggle('hidden');
    }

    function countActiveFilters() {
        let count = 0;
        if (document.getElementById('filter-anno').value) count++;
        if (document.getElementById('filter-autore').value.trim()) count++;
        if (document.getElementById('filter-sinossi').value.trim()) count++;
        if (document.getElementById('filter-tag').value) count++;
        if (document.getElementById('filter-preferito').checked) count++;
        return count;
    }

    function updateFiltersToggle() {
        const btn = document.getElementById('filters-toggle-btn');
        const count = countActiveFilters();
        btn.textContent = count > 0 ? `🔽 Filtri (${count})` : '🔽 Filtri';
        btn.style.color = count > 0 ? 'var(--accent)' : '';
    }

    function resetFilters() {
        document.getElementById('q').value = '';
        document.getElementById('filter-anno').value = '';
        document.getElementById('filter-autore').value = '';
        document.getElementById('filter-sinossi').value = '';
        document.getElementById('filter-tag').value = '';
        document.getElementById('filter-preferito').checked = false;
        document.getElementById('filters-panel').classList.add('hidden');
        document.getElementById('autore-suggestions').classList.remove('active');
        sessionStorage.removeItem('search-query');
        currentPage = 1;
        updateFiltersToggle();
        loadResults();
    }

    function buildQuery() {
        const params = new URLSearchParams();
        const q = document.getElementById('q').value.trim();
        const anno = document.getElementById('filter-anno').value;
        const autore = document.getElementById('filter-autore').value.trim();
        const sinossi = document.getElementById('filter-sinossi').value.trim();
        const preferito = document.getElementById('filter-preferito').checked;
        const tag = document.getElementById('filter-tag').value;

        if (q) params.set('q', q);
        if (anno) params.set('anno', anno);
        if (autore) params.set('autore', autore);
        if (sinossi) params.set('sinossi', sinossi);
        if (preferito) params.set('preferito', '1');
        if (tag) params.set('tag', tag);

        params.set('limit', LIMIT);
        params.set('offset', (currentPage - 1) * LIMIT);
        params.set('order', localStorage.getItem('diabolik-order') || 'desc');

        return params.toString();
    }

    function showSkeletons() {
        const grid = document.getElementById('grid');
        const count = Math.min(Math.max(totalResults || 12, 6), 24);
        let html = '';
        for (let i = 0; i < count; i++) {
            html += `
                <div class="card-skeleton">
                    <div class="cover-skeleton skeleton"></div>
                    <div class="info-skeleton">
                        <div class="${i % 3 === 2 ? 'title-skeleton-short' : 'title-skeleton'} skeleton"></div>
                        <div class="meta-skeleton skeleton"></div>
                    </div>
                </div>`;
        }
        grid.innerHTML = html;
    }

    async function loadResults() {
        showSkeletons();
        const qs = buildQuery();
        const data = await api('/api/albi?' + qs);
        totalResults = data.total;

        document.getElementById('counter').textContent =
            totalResults + ' albi trovati';

        const grid = document.getElementById('grid');
        grid.innerHTML = '';

        if (data.results.length === 0) {
            grid.innerHTML = '<p class="grid-empty">Nessun albo trovato</p>';
        }

        for (const a of data.results) {
            const card = document.createElement('div');
            card.className = 'card';
            card.onclick = () => {
                sessionStorage.setItem('search-query', qs);
                location.href = '/albo/' + encodeURIComponent(a.slug);
            };

            const coverSrc = coverUrl(a.copertina_locale);

            let badgesHtml = '';
            if (a.preferito) badgesHtml += '<span class="badge preferito">★</span>';
            if (a.ha_note) badgesHtml += '<span class="badge">📝</span>';

            card.innerHTML = `
                ${coverSrc
                    ? `<img class="cover" src="${escapeHtml(coverSrc)}" alt="${escapeHtml(a.titolo)}" data-titolo="${escapeHtml(a.titolo)}" onerror="imgFallback(this)">`
                    : `<div class="cover">${escapeHtml(a.titolo)}</div>`}
                <div class="info">
                    <div class="titolo">
                        <span class="titolo-text">${escapeHtml(a.titolo) || '---'}</span>
                        ${badgesHtml ? `<span class="badges">${badgesHtml}</span>` : ''}
                    </div>
                    <div class="meta">${escapeHtml(String(a.anno || '?'))} · #${escapeHtml(String(a.numero_inedito || '?'))}</div>
                </div>
            `;
            grid.appendChild(card);
        }

        updateFiltersToggle();
        renderPagination();
    }

    function renderPagination() {
        const totalPages = Math.ceil(totalResults / LIMIT);
        const pag = document.getElementById('pagination');
        pag.innerHTML = '';

        if (totalPages <= 1) return;

        pag.appendChild(createPageBtn('← Precedente', currentPage - 1, currentPage <= 1));

        const start = Math.max(1, currentPage - 2);
        const end = Math.min(totalPages, currentPage + 2);

        if (start > 1) {
            pag.appendChild(createPageBtn('1', 1, false));
            if (start > 2) {
                const span = document.createElement('span');
                span.textContent = '...';
                pag.appendChild(span);
            }
        }

        for (let p = start; p <= end; p++) {
            const btn = createPageBtn(String(p), p, false);
            if (p === currentPage) btn.classList.add('active');
            pag.appendChild(btn);
        }

        if (end < totalPages) {
            if (end < totalPages - 1) {
                const span = document.createElement('span');
                span.textContent = '...';
                pag.appendChild(span);
            }
            pag.appendChild(createPageBtn(String(totalPages), totalPages, false));
        }

        pag.appendChild(createPageBtn('Successivo →', currentPage + 1, currentPage >= totalPages));
    }

    function createPageBtn(text, page, disabled) {
        const btn = document.createElement('button');
        btn.textContent = text;
        btn.disabled = disabled;
        if (!disabled) {
            btn.onclick = () => { currentPage = page; loadResults(); window.scrollTo(0, 0); };
        }
        return btn;
    }

    async function loadYears() {
        const years = await api('/api/albi/filters/years');
        const sel = document.getElementById('filter-anno');
        years.forEach(y => {
            const opt = document.createElement('option');
            opt.value = y;
            opt.textContent = y;
            sel.appendChild(opt);
        });
    }

    async function loadTags() {
        allTags = await api('/api/tags');
        const sel = document.getElementById('filter-tag');
        allTags.forEach(t => {
            const opt = document.createElement('option');
            opt.value = t.nome;
            opt.textContent = t.nome + ' (' + t.conteggio + ')';
            sel.appendChild(opt);
        });
    }

    function restoreSearch() {
        const qs = sessionStorage.getItem('search-query');
        if (qs) {
            const params = new URLSearchParams(qs);
            document.getElementById('q').value = params.get('q') || '';
            document.getElementById('filter-anno').value = params.get('anno') || '';
            document.getElementById('filter-autore').value = params.get('autore') || '';
            document.getElementById('filter-sinossi').value = params.get('sinossi') || '';
            document.getElementById('filter-preferito').checked = params.get('preferito') === '1';
            const tag = params.get('tag') || '';
            document.getElementById('filter-tag').value = tag;
            if (tag || params.get('q') || params.get('anno') || params.get('autore') || params.get('sinossi') || params.get('preferito')) {
                document.getElementById('filters-panel').classList.remove('hidden');
            }
        }
    }

    const debouncedSearch = debounce(() => {
        currentPage = 1;
        loadResults();
    }, 300);

    document.getElementById('q').addEventListener('input', debouncedSearch);
    document.getElementById('filter-anno').addEventListener('change', debouncedSearch);
    document.getElementById('filter-autore').addEventListener('input', debouncedSearch);
    document.getElementById('filter-sinossi').addEventListener('input', debouncedSearch);
    document.getElementById('filter-preferito').addEventListener('change', debouncedSearch);
    document.getElementById('filter-tag').addEventListener('change', debouncedSearch);

    // Autore autocomplete
    function initAutoreAutocomplete() {
        const input = document.getElementById('filter-autore');
        const suggestions = document.getElementById('autore-suggestions');

        const fetchSuggestions = debounce(async function() {
            const val = input.value.trim();
            if (!val) {
                suggestions.classList.remove('active');
                return;
            }
            try {
                const results = await api('/api/albi/filters/autori?q=' + encodeURIComponent(val));
                if (!results.length) {
                    suggestions.classList.remove('active');
                    return;
                }
                suggestions.innerHTML = results.map(r =>
                    `<div class="tag-suggestion-item" data-val="${escapeHtml(r)}">${escapeHtml(r)}</div>`
                ).join('');
                suggestions.classList.add('active');

                suggestions.querySelectorAll('.tag-suggestion-item').forEach(item => {
                    item.onclick = function() {
                        input.value = this.dataset.val;
                        suggestions.classList.remove('active');
                        currentPage = 1;
                        loadResults();
                    };
                });
            } catch (e) {
                suggestions.classList.remove('active');
            }
        }, 250);

        input.addEventListener('input', fetchSuggestions);

        document.addEventListener('click', function(e) {
            if (!e.target.closest('.filter-autore-wrap')) {
                suggestions.classList.remove('active');
            }
        });
    }

    async function init() {
        await Promise.all([loadYears(), loadTags()]);
        restoreSearch();
        initAutoreAutocomplete();
        loadResults();
    }

    init();
</script>
</body>
</html>
